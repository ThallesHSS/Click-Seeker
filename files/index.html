<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Click Seeker Heróis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app">
        <header class="topo">
            <h1 class="titulo">Click Seeker</h1>
            <div class="ouro-box" id="ouro-box" aria-label="Ouro">
                <span class="moeda-icone" aria-hidden="true"></span>
                <span id="ouro">0</span>
            </div>
            <div class="acoes">
                <button class="btn-mini" id="btn-som" type="button" aria-pressed="true">Som: ligado</button>
                <button class="btn-mini" id="btn-salvar" type="button">Salvar</button>
                <button class="btn-mini" id="btn-zerar" type="button">Zerar</button>
            </div>
        </header>

        <main class="jogo">
            <section class="palco-col" aria-label="Combate">
                <div class="cena" id="cena">
                    <canvas class="fundo" id="fundo" width="160" height="96"></canvas>

                    <div class="cena-topo">
                        <span class="chip" id="zona-nome">Zona 1 · Floresta</span>
                        <span class="chip" id="pips"></span>
                    </div>

                    <div class="festa" id="festa" aria-hidden="true"></div>

                    <button class="monstro" id="monstro" type="button" aria-label="Atacar o monstro">
                        <span class="monstro-corpo"><canvas id="monstro-canvas" width="16" height="16"></canvas></span>
                    </button>

                    <div class="banner" id="banner" aria-hidden="true"></div>
                </div>

                <div class="alvo">
                    <div class="alvo-linha">
                        <span class="alvo-nome" id="monstro-nome">Gosma</span>
                        <span class="alvo-recorde" id="recorde">Recorde: zona 1</span>
                    </div>
                    <div class="vida" role="progressbar" aria-label="Vida do monstro">
                        <div class="vida-fill" id="vida-fill"></div>
                        <span class="vida-texto" id="vida-texto">10 / 10</span>
                    </div>
                    <div class="tempo" id="tempo" hidden>
                        <div class="tempo-fill" id="tempo-fill"></div>
                        <span class="tempo-texto" id="tempo-texto">30,0 s</span>
                    </div>
                </div>

                <p class="taxas">
                    <span>Dano por clique: <b id="dano-clique">1</b></span>
                    <span>Dano por segundo: <b id="dps">0</b></span>
                </p>

                <div class="habilidades" id="habilidades"></div>

                <button class="btn-modo-zona" id="btn-farm" type="button" aria-pressed="true">Modo: avançar de zona</button>
            </section>

            <section class="loja" aria-label="Heróis">
                <div class="loja-topo">
                    <h2>Heróis</h2>
                    <div class="modos" role="group" aria-label="Quantidade por compra">
                        <button class="btn-qtd" type="button" data-modo="1" aria-pressed="true">x1</button>
                        <button class="btn-qtd" type="button" data-modo="10" aria-pressed="false">x10</button>
                        <button class="btn-qtd" type="button" data-modo="25" aria-pressed="false">x25</button>
                        <button class="btn-qtd" type="button" data-modo="max" aria-pressed="false">Máx</button>
                    </div>
                </div>
                <ul class="lista-herois" id="lista-herois"></ul>
            </section>
        </main>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script src="sprites.js"></script>
    <script src="script.js"></script>
</body>
</html>
